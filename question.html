<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Question · Paroles Mystères</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="game-container">

        <!-- Logo -->
        <div class="logo">
            🎵
        </div>

        <!-- Numéro de la question -->
        <p class="question-number">
            Question <span id="current-question">1</span> / <span id="total-questions">10</span>
        </p>

        <!-- Carte des paroles -->
        <section class="lyrics-card">

            <p class="lyrics-intro">
                De quelle chanson sont extraites ces paroles ?
            </p>

            <div class="lyrics" id="lyrics">
                Chargement de la question...
            </div>

        </section>

        <!-- Carte de réponse -->
        <section class="answer-card">

            <label for="artist">
                <span>🎤 Artiste</span>
                <input
                    type="text"
                    id="artist"
                    placeholder="Nom de l'artiste"
                    autocomplete="off"
                >
            </label>

            <label for="title">
                <span>🎵 Titre de la chanson</span>
                <input
                    type="text"
                    id="title"
                    placeholder="Titre de la chanson"
                    autocomplete="off"
                >
            </label>

            <button
                type="button"
                id="validate-answer"
                class="play-button answer-button"
            >
                Valider ma réponse
            </button>

        </section>

        <!-- Score -->
        <p class="current-score">
            Score : <strong id="score">0</strong>
        </p>

        <!-- Retour -->
        <a href="jeu.html" class="back-link">
            ← Modifier les paramètres
        </a>

    </main>

    <!-- Pied de page -->
    <footer>
        Paroles Mystères · Jeu musical
    </footer>


    <!-- JavaScript -->
    <script src="js/questions.js"></script>
    <script src="js/question.js"></script>

</body>

</html>
